<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiros passos com DOM</title>
    <style>
        body {
            background-color: rgb(39, 75, 192);
            color: rgb(255, 255, 255);
            font: normal 18pt arial;
        }
    </style>
</head>

<body>
    <h1>Iniciando estudos com DOM</h1>
    <p>Aqui vai o resultado</p>
    <p>Aprendendo a usar o <strong>DOM</strong> em JavaScript.</p>
    <div id="msg">Click em mim</div>
    <br>
    <script>
        var p1 = window.document.getElementsByTagName('p')[1]
        window.document.write('Está escrito assim: ' + p1.innerText + '<br><br>')

        var ida = window.document.getElementById('msg')
        window.document.write(ida.innerText)
        ida.style.background = 'green'

        var teste = window.document.querySelector('div#msg')
        window.document.write('<br><br>' + teste.innerHTML)

    </script>

</body>

</html>
