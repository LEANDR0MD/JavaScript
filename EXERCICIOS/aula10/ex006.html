<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        div#area {
            font: normal 20pt arial;
            background: green;
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="area">
        interaja...

    </div>
    <script>
        area.addEventListener('click', clicar)
        area.addEventListener('mouseenter', entrar)
        area.addEventListener('mouseout', saiu)


        function clicar() {
            var areaaa = window.document.getElementById('area')
            areaaa.innerText = 'Clicou!'
        }

        function entrar() {
            var entrarrr = window.document.getElementById('area')
            entrarrr.innerHTML = 'Entrou'
            entrarrr.style.background = '#002480'
        }

        function saiu() {
            var saiuuu = window.document.getElementById('area')
            saiuuu.innerText = 'Saiu'
            saiuuu.style.background = 'green'
        }

    </script>

</body>

</html>
