<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro comando em javaScript</title>
    <style>
        body {
            background-color: rgb(126, 110, 249);
            color: white;
            font: normal 20pt arial;
        }
    </style>
</head>

<body>

    <h1>Olá, mundo!</h1>
    <p>Livre da maldição</p>
    <script>
        var numero1 = Number(window.prompt('Digite o primeiro valor!'))
        var numero2 = Number(window.prompt('Digite o segundo valor!'))
        var resultado = numero1 + numero2

        window.alert(`A soma entre ${numero1} e ${numero2} é igual a ${resultado}`)
    </script>


</body>

</html>
