<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var nome = window.prompt('Qual é seu nome ?')
        document.write(`<h2>Olá ${nome}, seu nome tem ${nome.length} letras.<br></h2>`)
        document.write(`Seu nome em maiusculo é ${nome.toUpperCase()} <br>`)
        document.write(`E seu nome em menusculo é ${nome.toLowerCase()}`)

    </script>
</body>

</html>
